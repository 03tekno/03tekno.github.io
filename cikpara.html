<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adli Para Cezası Net Hesaplama</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; padding: 40px 20px; }
        .calc-card { background: #ffffff; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 450px; border: 1px solid #e0e0e0; }
        h2 { color: #1a73e8; text-align: center; margin-bottom: 25px; font-weight: 700; }
        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #444; font-size: 14px; }
        input { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 10px; box-sizing: border-box; font-size: 16px; outline: none; transition: 0.2s; }
        input:focus { border-color: #1a73e8; background-color: #f8fbff; }
        button { width: 100%; background: #1a73e8; color: white; border: none; padding: 15px; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        button:hover { background: #1557b0; box-shadow: 0 4px 12px rgba(26,115,232,0.3); }
        
        #output { margin-top: 25px; padding: 20px; border-radius: 12px; background-color: #fdfdfd; display: none; border: 1px solid #eee; }
        .row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f0f0f0; }
        .row:last-child { border: none; }
        .label-text { color: #666; font-size: 15px; }
        .val-text { font-weight: 700; color: #222; font-size: 16px; }
        .final-price { color: #d93025 !important; font-size: 20px !important; }
    </style>
</head>
<body>

<div class="calc-card">
    <h2>Cezaevi Para Mahsup Hesaplama</h2>
    
    <div class="input-group">
        <label>Toplam Para Cezası (TL)</label>
        <input type="number" id="totalAmount" placeholder="Örn: 45000">
    </div>
    
    <div class="input-group">
        <label>Günlük Çevrilen Bedel (TL/Gün)</label>
        <input type="number" id="perDay" value="100">
    </div>

    <div class="input-group">
        <label>Cezaevine Giriş Tarihi</label>
        <input type="date" id="dateEntry">
    </div>

    <div class="input-group">
        <label>Ödeme/Tahliye Tarihi</label>
        <input type="date" id="dateExit">
    </div>

    <button onclick="calculate()">HESAPLA</button>

    <div id="output">
        <div class="row">
            <span class="label-text">Yatılan Gün Sayısı:</span>
            <span class="val-text" id="outDays">-</span>
        </div>
        <div class="row">
            <span class="label-text">Düşülen Tutar:</span>
            <span class="val-text" id="outDeducted" style="color: #1e8e3e;">-</span>
        </div>
        <div class="row" style="margin-top:10px;">
            <span class="label-text" style="font-weight: bold; color: #000;">KALAN BAKİYE:</span>
            <span class="val-text final-price" id="outFinal">-</span>
        </div>
    </div>
</div>

<script>
    function calculate() {
        const total = parseFloat(document.getElementById('totalAmount').value);
        const daily = parseFloat(document.getElementById('perDay').value);
        const d1 = new Date(document.getElementById('dateEntry').value);
        const d2 = new Date(document.getElementById('dateExit').value);

        if (isNaN(total) || isNaN(daily) || isNaN(d1.getTime()) || isNaN(d2.getTime())) {
            alert("Lütfen tüm alanları eksiksiz doldurun.");
            return;
        }

        // Gün farkı (Giriş ve çıkış günü dahil +1)
        const diffInTime = d2.getTime() - d1.getTime();
        const diffInDays = Math.ceil(diffInTime / (1000 * 3600 * 24)) + 1;

        if (diffInDays < 1) {
            alert("Tahliye tarihi girişten önce veya aynı an olamaz.");
            return;
        }

        // Herhangi bir limit koymadan doğrudan matematiksel hesap
        const deductedAmount = diffInDays * daily;
        const remainingBalance = total - deductedAmount;
        
        // Sonuçları ekrana yazdır (0'dan küçükse 0 göster)
        document.getElementById('outDays').innerText = diffInDays + " Gün";
        document.getElementById('outDeducted').innerText = deductedAmount.toLocaleString('tr-TR') + " TL";
        document.getElementById('outFinal').innerText = (remainingBalance < 0 ? 0 : remainingBalance).toLocaleString('tr-TR') + " TL";
        
        document.getElementById('output').style.display = 'block';
    }
</script>

</body>
</html>
