<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esmaül Hüsna</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background: #353535; 
            color: #ffffff;
            margin: 0; 
            padding: 15px; /* Mobilde kenar boşluğu azaltıldı */
        }
        .container { max-width: 1100px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 20px; }
        header h1 { color: #87cf3e; font-size: 1.8rem; margin-top: 10px; } /* Başlık mobilde küçültüldü */

        .search-box { 
            width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #454545; 
            background: #404040; color: white; margin-bottom: 20px; font-size: 1rem; box-sizing: border-box; 
        }

        .esma-grid { 
            display: grid; 
            /* Mobilde tek sütun, tablette/masaüstünde otomatik sığdırma */
            grid-template-columns: repeat(auto-fill, minmax(100%, 1fr)); 
            gap: 15px; 
        }

        @media (min-width: 600px) {
            .esma-grid { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
            header h1 { font-size: 2.5rem; }
        }

        .card { 
            background: #404040; border-radius: 15px; padding: 20px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.2); transition: 0.3s; cursor: pointer; 
            border-left: 5px solid #87cf3e; position: relative;
            display: flex; flex-direction: column; justify-content: center;
        }
        .card:active { background: #4a4a4a; transform: scale(0.98); } /* Mobil dokunma hissi */

        .card .arabic { 
            font-family: 'Amiri', serif; font-size: 2.2rem; color: #87cf3e; text-align: right; 
        }
        
        .card .name { font-size: 1.3rem; font-weight: bold; margin-top: 5px; }
        .card .short-desc { color: #ccc; font-size: 0.9rem; margin-top: 5px; line-height: 1.4; }

        /* Modal Mobil Düzenlemesi */
        #modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:100; overflow-y: auto; }
        .modal-content { 
            background: #353535; color: white; width: 85%; max-width: 450px; 
            margin: 20% auto; padding: 25px; border-radius: 20px; text-align: center; border: 1px solid #87cf3e;
            position: relative;
        }
        .close-btn { 
            cursor:pointer; font-size:18px; color:#87cf3e; display: inline-block; 
            margin-top: 25px; padding: 10px 20px; border: 1px solid #87cf3e; border-radius: 10px;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="esma-grid" id="main-grid"></div>
</div>

<div id="modal" onclick="closeModalOutside(event)">

    function render(data) {
        const grid = document.getElementById('main-grid');
        if (!grid) return;
        
        let html = '';
        data.forEach(item => {
            html += `
                <div class="card" onclick="openModal(${item.id})">
                    <div class="arabic">${item.arapca}</div>
                    <div class="name">${item.isim}</div>
                    <div class="short-desc">${item.anlam}</div>
                </div>
            `;
        });
        grid.innerHTML = html;
    }

    document.getElementById('search').addEventListener('input', (e) => {
        const text = e.target.value.toLowerCase();
        const filtered = allData.filter(i => 
            i.isim.toLowerCase().includes(text) || 
            i.anlam.toLowerCase().includes(text)
        );
        render(filtered);
    });

    function openModal(id) {
        const item = allData.find(i => i.id === id);
        const modalBody = document.getElementById('modal-body');
        modalBody.innerHTML = `
            <div style="font-family:'Amiri'; color:#87cf3e; font-size:3.5rem; line-height:1;">${item.arapca}</div>
            <h2 style="margin: 15px 0 10px 0;">${item.isim}</h2>
            <p style="color:#ddd; font-size:1.1rem; line-height:1.5;">${item.detay}</p>
        `;
        document.getElementById('modal').style.display = 'block';
        document.body.style.overflow = 'hidden'; // Arka plan kaymasını engelle
    }

    function closeModal() {
        document.getElementById('modal').style.display = 'none';
        document.body.style.overflow = 'auto';
    }

    // Modal dışına tıklandığında kapatma
    function closeModalOutside(e) {
        if(e.target.id === 'modal') closeModal();
    }

    window.onload = function() {
        render(allData);
    };
</script>

</body>
</html>
