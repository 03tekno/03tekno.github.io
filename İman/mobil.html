<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İman İlmihali - Tahkikî İman Yolu</title>
    <style>
        :root { --p: #2c3e50; --s: #27ae60; --bg: #f1f2f6; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; background: var(--bg); overflow: hidden; }
        
        #mobile-header {
            display: none; background: var(--p); color: white; padding: 15px;
            justify-content: space-between; align-items: center; z-index: 1001;
        }
        #menu-toggle { background: none; border: 1px solid white; color: white; padding: 5px 10px; border-radius: 4px; cursor: pointer; }

        #sidebar { 
            width: 320px; background: white; border-right: 1px solid #ddd; 
            display: flex; flex-direction: column; transition: 0.3s ease;
        }
        .header { padding: 20px; background: var(--p); color: white; text-align: center; }
        #menu-list { overflow-y: auto; flex-grow: 1; }
        .menu-item { 
            padding: 12px 18px; cursor: pointer; border-bottom: 1px solid #eee;
            transition: 0.2s; display: block; text-decoration: none; color: #333; font-size: 14px;
            line-height: 1.5;
        }
        .menu-item:hover { background: #f8f9fa; color: var(--s); }
        .active { background: #e8f5e9 !important; border-left: 6px solid var(--s); font-weight: bold; }

        #viewer { flex-grow: 1; overflow: hidden; position: relative; }
        iframe { width: 100%; height: 100%; border: none; background: white; }

        @media (max-width: 768px) {
            #mobile-header { display: flex; }
            #sidebar { position: fixed; left: -320px; top: 0; bottom: 0; z-index: 1000; box-shadow: 5px 0 15px rgba(0,0,0,0.2); }
            #sidebar.open { left: 0; }
            #overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 999; }
            #overlay.show { display: block; }
        }
    </style>
</head>
<body>

<div id="mobile-header">
    <div style="font-weight: bold;">İMAN İLMİHALİ</div>
    <button id="menu-toggle" onclick="toggleMenu()">☰ Menü</button>
</div>

<div id="overlay" onclick="toggleMenu()"></div>

<div id="sidebar">
    <div class="header">
        <small>MobilTurka 2026</small>
        <div style="font-weight: bold;">İMAN İLMİHALİ</div>
    </div>
    <div id="menu-list"></div>
</div>

<div id="viewer">
    <iframe name="content-frame" id="content-frame" src="001-Önsöz.txt"></iframe>
</div>

<script>
    const menuList = document.getElementById('menu-list');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');

    function toggleMenu() {
        sidebar.classList.toggle('open');
        overlay.classList.toggle('show');
    }

    async function initApp() {
        for (let i = 1; i <= 41; i++) {
            let num = i.toString().padStart(3, '0');
            
            // Dosya ismi bulma mantığı
            let fileName = `${num}.txt`;
            if (i === 1) fileName = "001-Önsöz.txt";
            if (i === 2) fileName = "002-Din nedir.txt";

            const a = document.createElement('a');
            a.className = 'menu-item';
            a.target = 'content-frame';
            a.href = fileName;
            
            // Başlangıçta "001- ..." formatında oluştur
            a.innerHTML = `<span id="t-${num}">${num}- Yükleniyor...</span>`;
            
            if(i === 1) a.classList.add('active');

            a.onclick = function() {
                document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
                this.classList.add('active');
                if (window.innerWidth <= 768) toggleMenu();
            };

            menuList.appendChild(a);
            fetchTitle(fileName, num);
        }
    }

    async function fetchTitle(path, id) {
        try {
            const response = await fetch(path);
            if (!response.ok) throw new Error();
            const text = await response.text();
            
            // İlk satırı al ve temizle
            const firstLine = text.split('\n')[0].replace(/[#*]/g, '').trim();
            
            // Menü formatı: "001- Başlık"
            document.getElementById(`t-${id}`).innerText = `${id}- ${firstLine}`;
        } catch (err) {
            // Hata durumunda varsayılan: "001- Konu 1"
            document.getElementById(`t-${id}`).innerText = `${id}- Konu ${parseInt(id)}`;
        }
    }

    initApp();
</script>

</body>
</html>
