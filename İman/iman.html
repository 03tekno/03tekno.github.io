<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İman İlmihali - Otomatik Sistem</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --ana: #2c3e50; --vurgu: #27ae60; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; }
        header { background: var(--ana); color: white; padding: 20px; text-align: center; font-weight: bold; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; padding: 20px; }
        .kart { 
            background: white; border-radius: 12px; padding: 20px; text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); cursor: pointer; border: 1px solid #eee;
        }
        .kart i { font-size: 30px; color: var(--vurgu); margin-bottom: 10px; display: block; }
        .kart span { font-size: 13px; font-weight: 600; color: var(--ana); }
        #okuyucu { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; flex-direction: column; z-index: 1000; }
        .ust-bar { background: var(--ana); color: white; padding: 15px; display: flex; align-items: center; }
        #icerik { flex: 1; padding: 25px; overflow-y: auto; white-space: pre-wrap; font-size: 18px; line-height: 1.6; }
        .geri { font-size: 24px; margin-right: 15px; cursor: pointer; }
    </style>
</head>
<body>

<header>İMAN İLMİHALİ</header>
<div class="grid" id="menu"></div>

<div id="okuyucu">
    <div class="ust-bar">
        <i class="fa-solid fa-chevron-left geri" onclick="document.getElementById('okuyucu').style.display='none'"></i>
        <span id="baslik"></span>
    </div>
    <div id="icerik">Yükleniyor...</div>
</div>

<script>
    // Buraya sadece dosya isimlerini yazıyoruz, metinleri değil!
    const dosyalar = [
        "001-Önsöz", "002-Din nedir", "003-İnsan hayatında dinin yeri", "004-Dinlerin sınıflandırılması", "005-İnsanlığın ilk dini", 
        "006-Batıl dinler ve Son din", "007-İslam dini", "008-İslam dininin temel özellikleri", "009-İman nedir", "010-Amentü", 
        "011-İman ve inkar bakımından insanlar", "012-İmanın mertebeleri", "013-İmanın insan için önemi", "014-İnsanlar niçin dünyaya gelmiştir", "015-Allaha iman", 
	"016-Allahı görmek ve mahiyetini kavramak", "017-Allah sevgisi ve korkusu", "018-Allahın sıfatları", "019-Allahın varlığına dair deliller", "020-Görmediğime inanmam meselesi", 
	"021-Allahın birliği ve tevhid delilleri", "022-Şirk", "023-Esmaül Hüsna", "024-İsm-i Azam", "025-Meleklere iman", 
	"026-Meleklerin vazifeleri", "027-Cin ve şeytanlar", "028-Cin ve şeytanların insana etkisi", "029-Kitaplara iman", "030-Kuran-ı Kerim ve mucizeleri",
	"031-Kuran neden arapça", "032-Kuran yeterli mi", "033-Peygamberlere iman", "034-Vahiy nedir ve neden ayrı ayrı peygamberler geldi", "035-Mucize ve Peygamber mucizeleri",
	"036-Hz Muhammed ve evrenselliği", "037-Ahiret gününe iman", "038-Cennet Cehennem ve Kevser", "039-Kaza ve Kadere iman", "040-Hayır ve Şerler",  "041-Mezhepler",
    ];

    const menu = document.getElementById('menu');

    dosyalar.forEach(dosyaAdi => {
        const kart = document.createElement('div');
        kart.className = 'kart';
        kart.innerHTML = `<i class="fa-solid fa-book"></i><span>${dosyaAdi}</span>`;
        
        kart.onclick = () => {
            document.getElementById('baslik').innerText = dosyaAdi;
            document.getElementById('okuyucu').style.display = 'flex';
            
            // İŞTE BURASI OTOMATİK OKUYOR:
            fetch(`${dosyaAdi}.txt`)
                .then(res => res.text())
                .then(metin => {
                    document.getElementById('icerik').innerText = metin;
                })
                .catch(err => {
                    document.getElementById('icerik').innerText = "Dosya bulunamadı. Lütfen TXT dosyasının HTML ile aynı klasörde olduğundan emin olun.";
                });
        };
        menu.appendChild(kart);
    });
</script>
</body>
</html>
