<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Hadis Veritabanı - Gelişmiş Arama</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Amiri&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #1a5f7a; --bg: #f8f9fa; --border: #e0e0e0; }
        body { font-family: 'Inter', sans-serif; margin: 0; display: flex; height: 100vh; background: var(--bg); overflow: hidden; }
        
        /* Sütunlar */
        .col { height: 100vh; overflow-y: auto; border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        #fasil-col { width: 20%; background: #fff; }
        #konu-col { width: 25%; background: #fafafa; }
        #hadis-col { width: 55%; background: #fff; position: relative; }

        /* Arama ve Başlıklar */
        .search-container { padding: 15px; background: #fff; border-bottom: 1px solid var(--border); }
        .search-input { width: 100%; padding: 10px; border: 2px solid var(--border); border-radius: 8px; font-size: 0.9rem; outline: none; box-sizing: border-box; }
        .search-input:focus { border-color: var(--primary); }
        
        .header { padding: 15px; background: var(--primary); color: white; font-weight: bold; position: sticky; top: 0; z-index: 10; font-size: 0.9rem; }
        
        /* Liste Öğeleri */
        .list-container { flex: 1; overflow-y: auto; }
        .item { padding: 12px 20px; border-bottom: 1px solid #f0f0f0; cursor: pointer; transition: 0.2s; font-size: 0.85rem; display: flex; align-items: flex-start; }
        .item:hover { background: #f0f7f9; }
        .item.active { background: var(--primary); color: white; }
        .hadis-no { background: #eee; color: #666; font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; margin-right: 10px; min-width: 30px; text-align: center; }
        .active .hadis-no { background: rgba(255,255,255,0.2); color: white; }

        /* Hadis Kartı */
        .hadis-content { padding: 40px; max-width: 900px; margin: auto; }
        .hadis-id-tag { color: var(--primary); font-weight: bold; margin-bottom: 10px; display: block; font-size: 0.9rem; }
        .arabic { font-family: 'Amiri', serif; font-size: 2rem; direction: rtl; text-align: right; line-height: 2; margin-bottom: 30px; padding: 25px; background: #fcfcfc; border-radius: 12px; border: 1px solid #eee; }
        .turkish { font-size: 1.15rem; line-height: 1.8; color: #2c3e50; margin-bottom: 30px; text-align: justify; }
        .serh-container { padding: 25px; background: #fff9f0; border-radius: 12px; border-left: 5px solid #f39c12; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .serh-title { font-weight: bold; color: #d35400; margin-bottom: 10px; display: block; }
    </style>
</head>
<body>

<div id="fasil-col" class="col">
    <div class="header">📚 Fasıllar</div>
    <div class="list-container" id="fasil-list"></div>
</div>

<div id="konu-col" class="col">
    <div class="search-container">
        <input type="text" id="search-input" class="search-input" placeholder="Hadislerde ara...">
    </div>
    <div class="header" id="konu-header">📂 Konular</div>
    <div class="list-container" id="konu-list"></div>
</div>

<div id="hadis-col" class="col">
    <div id="display-area" class="hadis-content">
        <div style="text-align:center; color:#ccc; margin-top:100px;">
            <h2>Hadis Gezgini</h2>
            <p>Soldan bir seçim yapın veya arama çubuğunu kullanın.</p>
        </div>
    </div>
</div>

<script>
    let db;
    
    async function init() {
        try {
            const SQL = await initSqlJs({ locateFile: f => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${f}` });
            const data = await fetch('hadisler.db').then(res => res.arrayBuffer());
            db = new SQL.Database(new Uint8Array(data));
            loadFasillar();
            setupSearch();
        } catch (e) {
            document.getElementById('display-area').innerHTML = `<h3 style="color:red; padding:20px;">Hata: Veritabanı (hadisler.db) yüklenemedi. Yerel sunucu kullandığınızdan emin olun.</h3>`;
        }
    }

    // Fasılları Yükle
    function loadFasillar() {
        const res = db.exec("SELECT DISTINCT fasil FROM hadisler WHERE fasil != '' ORDER BY _id");
        const list = document.getElementById('fasil-list');
        list.innerHTML = "";
        res[0].values.forEach(val => {
            const div = document.createElement('div');
            div.className = 'item';
            div.innerText = val[0];
            div.onclick = () => {
                document.querySelectorAll('#fasil-list .item').forEach(i => i.classList.remove('active'));
                div.classList.add('active');
                loadKonular(val[0]);
            };
            list.appendChild(div);
        });
    }

    // Konuları/Hadisleri Yükle
    function loadKonular(fasil) {
        const stmt = db.prepare("SELECT _id, konu FROM hadisler WHERE fasil = ? ORDER BY _id");
        stmt.bind([fasil]);
        const list = document.getElementById('konu-list');
        document.getElementById('konu-header').innerText = "📂 " + fasil;
        list.innerHTML = '';
        while(stmt.step()) {
            const row = stmt.getAsObject();
            const div = document.createElement('div');
            div.className = 'item';
            div.innerHTML = `<span class="hadis-no">${row._id}</span> <span>${row.konu}</span>`;
            div.onclick = () => {
                document.querySelectorAll('#konu-list .item').forEach(i => i.classList.remove('active'));
                div.classList.add('active');
                showHadis(row._id);
            };
            list.appendChild(div);
        }
    }

    // Arama Fonksiyonu
    function setupSearch() {
        const input = document.getElementById('search-input');
        input.oninput = (e) => {
            const query = e.target.value;
            if (query.length < 3) return; // 3 harften az ise arama yapma

            const stmt = db.prepare("SELECT _id, konu FROM hadisler WHERE hadis LIKE ? OR konu LIKE ? OR arabca LIKE ? LIMIT 50");
            stmt.bind([`%${query}%`, `%${query}%`, `%${query}%`]);
            
            const list = document.getElementById('konu-list');
            document.getElementById('konu-header').innerText = "🔍 Arama Sonuçları";
            list.innerHTML = '';
            while(stmt.step()) {
                const row = stmt.getAsObject();
                const div = document.createElement('div');
                div.className = 'item';
                div.innerHTML = `<span class="hadis-no">${row._id}</span> <span>${row.konu}</span>`;
                div.onclick = () => showHadis(row._id);
                list.appendChild(div);
            }
        };
    }

    // Hadis Detayını Göster
    function showHadis(id) {
        const stmt = db.prepare(`
            SELECT h._id, h.arabca, h.hadis, s.serh 
            FROM hadisler h 
            LEFT JOIN serh s ON h.serh1_id = s._id 
            WHERE h._id = ?
        `);
        stmt.bind([id]);
        if(stmt.step()) {
            const row = stmt.getAsObject();
            document.getElementById('display-area').innerHTML = `
                <div class="hadis-id-tag">Hadis No: #${row._id}</div>
                <div class="arabic">${row.arabca || ''}</div>
                <div class="turkish">${row.hadis || ''}</div>
                ${row.serh ? `
                    <div class="serh-container">
                        <span class="serh-title">📝 ŞERH VE AÇIKLAMA</span>
                        <div>${row.serh}</div>
                    </div>` : ''}
            `;
        }
    }

    init();
</script>
</body>
</html>
