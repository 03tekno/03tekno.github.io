<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doğa Eczanesi</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f1; color: #2d3436; margin: 0; padding: 15px; }
        .container { max-width: 600px; margin: auto; }
        h1 { text-align: center; color: #1b5e20; }
        .category-item { margin-bottom: 8px; border-radius: 10px; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.05); overflow: hidden; border: 1px solid #c8e6c9; }
        .category-btn {
            width: 100%; padding: 14px 18px; border: none; background: white;
            text-align: left; font-size: 1rem; font-weight: bold; cursor: pointer;
            display: flex; justify-content: space-between;
        }
        .category-btn.active { background: #4caf50; color: white; }
        .med-list { display: none; padding: 10px 18px; background: #fff; }
        .med-item { padding: 12px 0; border-bottom: 1px solid #f1f1f1; }
        .name { color: #2e7d32; font-weight: bold; }
        .info { font-size: 0.85rem; color: #444; background: #f9f9f9; padding: 8px; border-radius: 6px; border-left: 3px solid #4caf50; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🌿 Doğa Eczanesi</h1>
    <div id="app">Veriler yükleniyor...</div>
</div>

<script>
    // Verileri JSON dosyasından çekiyoruz
    fetch('bitki.json')
        .then(response => response.json())
        .then(data => {
            const app = document.getElementById('app');
            app.innerHTML = ''; // "Yükleniyor" yazısını sil

            Object.keys(data).forEach(cat => {
                const item = document.createElement('div');
                item.className = 'category-item';

                const btn = document.createElement('button');
                btn.className = 'category-btn';
                btn.innerHTML = `<span>${cat}</span> <span>▼</span>`;
                
                const list = document.createElement('div');
                list.className = 'med-list';
                
                data[cat].forEach(med => {
                    list.innerHTML += `
                        <div class="med-item">
                            <span class="name">${med.n}</span>
                            <div class="info"><b>Kullanım:</b> ${med.u}</div>
                        </div>`;
                });

                btn.onclick = () => {
                    const isActive = btn.classList.contains('active');
                    document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
                    document.querySelectorAll('.med-list').forEach(l => l.style.display = 'none');
                    
                    if (!isActive) {
                        btn.classList.add('active');
                        list.style.display = 'block';
                    }
                };

                item.appendChild(btn);
                item.appendChild(list);
                app.appendChild(item);
            });
        })
        .catch(error => {
            document.getElementById('app').innerHTML = 'Veri yüklenemedi. Lütfen veritabani.json dosyasını kontrol edin.';
            console.error('Hata:', error);
        });
</script>

</body>
</html>
