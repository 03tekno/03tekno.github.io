<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarih Hesaplayıcı</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; padding: 20px; }
        .container { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 100%; max-width: 450px; }
        h2 { color: #2c3e50; text-align: center; margin-bottom: 1.5rem; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .section { margin-bottom: 2rem; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        .result { background: #e8f4fd; padding: 10px; border-radius: 6px; font-weight: bold; color: #2980b9; min-height: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h2>📅 Tarih Hesaplayıcı</h2>

    <div class="section">
        <h3>İki Tarih Arası Kaç Gün?</h3>
        <label>Başlangıç Tarihi:</label>
        <input type="date" id="startDate" onchange="calculateDiff()">
        <label>Bitiş Tarihi:</label>
        <input type="date" id="endDate" onchange="calculateDiff()">
        <div class="result" id="diffResult">Sonuç burada görünecek...</div>
    </div>

    <hr>

    <div class="section">
        <h3>Tarihe Gün Ekle / Çıkar</h3>
        <label>Tarih Seçin:</label>
        <input type="date" id="baseDate" onchange="addDays()">
        <label>Eklenecek Gün Sayısı (Çıkarmak için - yazın):</label>
        <input type="number" id="daysToAdd" placeholder="Örn: 121" oninput="addDays()">
        <div class="result" id="addResult">Sonuç burada görünecek...</div>
    </div>
</div>

<script>
    // İki tarih arasındaki farkı hesaplar
    function calculateDiff() {
        const start = document.getElementById('startDate').value;
        const end = document.getElementById('endDate').value;
        const resultDiv = document.getElementById('diffResult');

        if (start && end) {
            const d1 = new Date(start);
            const d2 = new Date(end);
            const diffTime = Math.abs(d2 - d1);
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            resultDiv.innerText = `Aralık: ${diffDays} gün`;
        }
    }

    // Belirli bir tarihe gün ekler
    function addDays() {
        const base = document.getElementById('baseDate').value;
        const days = parseInt(document.getElementById('daysToAdd').value);
        const resultDiv = document.getElementById('addResult');

        if (base && !isNaN(days)) {
            const date = new Date(base);
            date.setDate(date.getDate() + days);
            
            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
            resultDiv.innerText = `Yeni Tarih: ${date.toLocaleDateString('tr-TR', options)}`;
        } else {
            resultDiv.innerText = "Lütfen tarih ve gün sayısı girin.";
        }
    }
</script>

</body>
</html>
