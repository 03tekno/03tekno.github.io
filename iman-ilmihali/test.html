<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İman ve Ahlak İlmihali - Mobilturka</title>
    <link rel="icon" type="image/png" href="iman.png">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Modern Renk Paleti (iman.png tonları baz alınmıştır) */
        :root { 
            --ana: #1a4d4a; /* Koyu Zümrüt / Kitap Rengi */
            --vurgu: #2a6f6b; 
            --bg: #f8f9fa; 
            --kart-bg: #ffffff;
            --yazi: #2d3436;
            --alt-yazi: #636e72;
            --beyaz: #ffffff;
            --golge: rgba(0, 0, 0, 0.1);
        }
        
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: var(--bg); 
            margin: 0; 
            color: var(--yazi);
            line-height: 1.6;
        }

        header { 
            background: var(--ana); 
            color: var(--beyaz); 
            padding: 30px 20px; 
            text-align: center; 
            box-shadow: 0 4px 12px var(--golge);
            border-bottom: 4px solid var(--vurgu);
        }

        header h1 {
            margin: 0;
            font-size: 1.5rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Kart Konteyneri */
        .container { 
            max-width: 1200px; 
            margin: 40px auto; 
            padding: 0 20px; 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 25px; 
        }

        /* Kitap Kartları */
        .kart { 
            background: var(--kart-bg); 
            padding: 30px 20px; 
            border-radius: 16px; 
            text-align: center; 
            cursor: pointer; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 6px var(--golge);
            border: 1px solid rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .kart:hover { 
            transform: translateY(-10px); 
            box-shadow: 0 12px 20px rgba(26, 77, 74, 0.15);
            border-color: var(--vurgu);
        }

        .kart i { 
            font-size: 3rem; 
            color: var(--ana); /* Kitap ikonu rengi */
            margin-bottom: 15px;
            transition: transform 0.3s ease;
        }

        .kart:hover i {
            transform: scale(1.1);
        }

        .kart span { 
            font-weight: 600; 
            font-size: 1.1rem;
            color: var(--ana);
        }

        /* Tam Ekran Okuyucu */
        #okuyucu { 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: var(--beyaz); 
            display: none; 
            flex-direction: column; 
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .ust-bar { 
            background: var(--ana); 
            color: white; 
            padding: 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            box-shadow: 0 2px 10px var(--golge);
        }

        .ust-bar h2 { margin: 0; font-size: 1.2rem; }

        .icerik-alanı { 
            flex: 1; 
            padding: 40px 20px; 
            overflow-y: auto; 
            font-size: 1.2rem; 
            max-width: 800px;
            margin: 0 auto;
            color: #333;
            white-space: pre-wrap;
            text-align: justify;
        }

        /* Alt Kontrol Barı */
        .alt-bar { 
            background: #f1f2f6; 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
            gap: 20px;
            border-top: 1px solid #ddd;
        }

        .btn { 
            padding: 12px 25px; 
            border: none; 
            border-radius: 30px; 
            cursor: pointer; 
            font-weight: bold; 
            display: flex; 
            align-items: center; 
            gap: 10px;
            transition: 0.2s;
            font-family: inherit;
        }

        .btn-kapat { background: #636e72; color: white; }
        .btn-ses { background: var(--ana); color: white; min-width: 120px; justify-content: center; }
        .btn-ses.active { background: #d63031; }
        
        .btn:active { transform: scale(0.95); }

        /* Responsive */
        @media (max-width: 600px) {
            .container { grid-template-columns: 1fr; }
            .icerik-alanı { font-size: 1.1rem; padding: 20px; }
        }
    </style>
</head>
<body>

<header>
    <img src="iman.png" alt="Logo" style="height: 60px; margin-bottom: 10px;">
    <h1>İMAN VE AHLAK İLMİHALİ</h1>
</header>

<div class="container" id="menu"></div>

<div id="okuyucu">
    <div class="ust-bar">
        <h2 id="baslik"></h2>
        <button class="btn btn-kapat" onclick="kapatOkuyucu()"><i class="fas fa-times"></i></button>
    </div>
    <div class="icerik-alanı" id="icerik"></div>
    <div class="alt-bar">
        <button id="btnSes" class="btn btn-ses" onclick="toggleSes()">
            <i class="fas fa-volume-up"></i> <span id="btnMetin">Oku</span>
        </button>
    </div>
</div>

<script>
    const kitaplar = [
        "İslam ve İman", "İslamın Şartları", "İmanın Şartları", "Kur'an-ı Kerim", 
        "Peygamberimiz", "Namaz", "Oruç", "Zekat", "Hac", "Kurban", 
        "Dua ve Zikir", "Güzel Ahlak", "Farzlar", "Vacipler", "Sünnetler"
    ];

    const menu = document.getElementById('menu');
    const okuyucu = document.getElementById('okuyucu');
    const icerikDiv = document.getElementById('icerik');
    const synth = window.speechSynthesis;
    let utterance;

    kitaplar.forEach(dosyaAdi => {
        const kart = document.createElement('div');
        kart.className = 'kart';
        kart.innerHTML = `
            <i class="fas fa-book-open"></i>
            <span>${dosyaAdi}</span>
        `;
        kart.onclick = () => {
            document.getElementById('baslik').innerText = dosyaAdi;
            icerikDiv.innerText = "Yükleniyor...";
            okuyucu.style.display = 'flex';
            
            fetch(`${dosyaAdi}.txt`)
                .then(res => { if(!res.ok) throw new Error(); return res.text(); })
                .then(metin => {
                    icerikDiv.innerText = metin;
                    icerikDiv.scrollTop = 0;
                })
                .catch(() => { icerikDiv.innerText = "Hata: Dosya bulunamadı."; });
        };
        menu.appendChild(kart);
    });

    function toggleSes() {
        if (synth.speaking) {
            synth.cancel();
            resetSesButonu();
        } else {
            const metin = document.getElementById('icerik').innerText;
            utterance = new SpeechSynthesisUtterance(metin);
            utterance.lang = 'tr-TR';
            
            utterance.onend = () => { resetSesButonu(); };

            synth.speak(utterance);
            document.getElementById('btnMetin').innerText = "Durdur";
            document.getElementById('btnSes').classList.add('active');
        }
    }

    function resetSesButonu() {
        document.getElementById('btnMetin').innerText = "Oku";
        document.getElementById('btnSes').classList.remove('active');
    }

    function kapatOkuyucu() {
        synth.cancel();
        okuyucu.style.display = 'none';
        resetSesButonu();
    }
</script>

</body>
</html>
