        {n:"Çay Ağacı Yağı", g:"Küf önleyici.", d:"10 damla", u:"Suya katıp sil."}, {n:"Biberiye", g:"Böcek kovucu.", d:"Demet", u:"Kapı eşiğine."}
    ]
};

const app = document.getElementById('app');

Object.keys(data).forEach(cat => {
    const item = document.createElement('div');
    item.className = 'category-item';

    const btn = document.createElement('button');
    btn.className = 'category-btn';
    btn.innerHTML = `<span>${cat}</span> <span class="arrow">▼</span>`;
    
    const list = document.createElement('div');
    list.className = 'med-list';
    
    data[cat].forEach(med => {
        list.innerHTML += `
            <div class="med-item">
                <span class="name">${med.n}</span>
                <div class="desc"><b>Etki:</b> ${med.g}</div>
                <div class="info">
                    <b>Miktar:</b> ${med.d} | <b>Öneri:</b> ${med.u}
                </div>
            </div>
        `;
    });

    btn.onclick = () => {
        const isActive = btn.classList.contains('active');
        document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.med-list').forEach(l => l.style.display = 'none');
        document.querySelectorAll('.name').forEach(n => n.classList.remove('active-text'));
        
        if (!isActive) {
            btn.classList.add('active');
            list.style.display = 'block';
            list.querySelectorAll('.name').forEach(n => n.classList.add('active-text'));
        }
    };

    item.appendChild(btn);
    item.appendChild(list);
    app.appendChild(item);
});
</script>

</body>
</html>
